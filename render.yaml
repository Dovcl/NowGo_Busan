services:
  # Backend (FastAPI)
  - type: web
    name: nowgo-busan-backend
    plan: free
    region: singapore
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      # Database credentials (set manually in Render console after creating PostgreSQL)
      - key: DATABASE_NAME
        value: nowgo_busan
      - key: DATABASE_USER
        value: nowgo
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_PASSWORD
        sync: false
      # App config
      - key: MOCK_MODE
        value: "false"
      - key: FRONTEND_ORIGINS
        sync: false
      # API keys (will be filled in Render console)
      - key: TOUR_API_KEY
        sync: false
      - key: TOUR_API_KEY_BEACH
        sync: false
      - key: TOUR_API_KEY_IAN
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: AIR_KOREA_API_KEY
        sync: false
      - key: KOPIS_API_KEY
        sync: false

  # 부산 링크소통정보 매시간 수집 (s_traffic 도로 baseline)
  - type: cron
    name: nowgo-busan-fetch-road-traffic
    plan: starter
    region: singapore
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "10 * * * *"
    startCommand: python -m etl.fetch_road_traffic
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_NAME
        value: nowgo_busan
      - key: DATABASE_USER
        value: nowgo
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_PASSWORD
        sync: false
      - key: TOUR_API_KEY
        sync: false

  # 날씨·UV·대기질·이안류 매시간 수집 (개별 Cron Job 4개 대신 하나로 묶어 비용 절감)
  - type: cron
    name: nowgo-busan-fetch-environment
    plan: starter
    region: singapore
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "15 * * * *"
    startCommand: python -m etl.fetch_environment_batch
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_NAME
        value: nowgo_busan
      - key: DATABASE_USER
        value: nowgo
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_PASSWORD
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: AIR_KOREA_API_KEY
        sync: false
      - key: TOUR_API_KEY_IAN
        sync: false
      - key: TOUR_API_KEY
        sync: false

  # 관광지 목록/상세(+누락 랜드마크 화이트리스트)·영어/중국어 번역 매일 1회 수집.
  # free 웹서비스의 in-process 스케줄러는 서비스가 슬립 중이면 새벽 배치가 조용히
  # 스킵될 수 있어서(harness/DECISIONS.md 2026-09-12) 별도 Cron Job으로 분리.
  - type: cron
    name: nowgo-busan-fetch-tour-spots
    plan: starter
    region: singapore
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    schedule: "30 4 * * *"
    startCommand: python -m etl.fetch_tour_spots_batch
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_NAME
        value: nowgo_busan
      - key: DATABASE_USER
        value: nowgo
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_PASSWORD
        sync: false
      - key: TOUR_API_KEY
        sync: false
      - key: ENG_SERVICE_API_KEY
        sync: false
      - key: CHN_SERVICE_API_KEY
        sync: false
