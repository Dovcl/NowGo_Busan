services:
  # Backend (FastAPI)
  - type: web
    name: nowgo-busan-backend
    plan: free
    region: singapore
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      # Database credentials (set manually in Render console after creating PostgreSQL)
      - key: DATABASE_NAME
        value: nowgo_busan
      - key: DATABASE_USER
        value: nowgo
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_PASSWORD
        sync: false
      # App config
      - key: MOCK_MODE
        value: "false"
      - key: FRONTEND_ORIGINS
        sync: false
      # API keys (will be filled in Render console)
      - key: TOUR_API_KEY
        sync: false
      - key: TOUR_API_KEY_BEACH
        sync: false
      - key: TOUR_API_KEY_IAN
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: WEATHER_API_KEY
        sync: false
      - key: AIR_KOREA_API_KEY
        sync: false
      - key: KOPIS_API_KEY
        sync: false
